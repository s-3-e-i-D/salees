name: iOS IPA

on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:ios
      - run: npx cap add ios
      - name: Allow the microphone
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName سَلِس" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string المايك يحوّل الصوت إلى نص داخل سَلِس" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string التعرف على الكلام يكتب اللي تقوله" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true
      - name: Archive without a signing certificate
        run: |
          set -euo pipefail
          cd ios/App
          if [ -d App.xcworkspace ]; then
            TARGET=(-workspace App.xcworkspace)
          else
            TARGET=(-project App.xcodeproj)
          fi
          xcodebuild "${TARGET[@]}" -scheme App -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive
          APP="$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" -name '*.app' -maxdepth 1 | head -1)"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/Salees.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: Salees-ipa
          path: Salees.ipa
          if-no-files-found: error
